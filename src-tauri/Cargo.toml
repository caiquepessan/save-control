[package]
name = "save-control"
version.workspace = true
edition.workspace = true

[lib]
name = "save_control_lib"
crate-type = ["rlib"]

[dependencies]
chrono = "0.4.45"
savecontrol-app = { version = "0.1.0", path = "../crates/app" }
savecontrol-core = { version = "0.1.0", path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[workspace]
members = ["crates/core", "crates/cli", "crates/app", "src-tauri"]
# O app Tauri (src-tauri) precisa da interface compilada; fica fora do `cargo test` padrão.
default-members = ["crates/core", "crates/cli", "crates/app", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[package]
name = "savecontrol-core"
version.workspace = true
edition.workspace = true

[dependencies]
bincode = "1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
glob = "0.3.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
ureq = "2"
uuid = { version = "1.29.3", features = ["v4"] }
walkdir = "2.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
